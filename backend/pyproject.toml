[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Production Ready Backend Template"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]==0.142.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",
    "pwdlib[argon2]>=0.3.1",
    #"httpx2>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.51", # required asyncio dependencies (including greenlet in current versions). Starting
    # with SQLAlchemy 2.0, the asyncio dependencies are no longer installed by default.
    #"psycopg[binary]>=3.3.4", # Newest version(V3) and if neede use this instead of psycopg2
    #"psycopg2-binary>=2.9.12", # Add because SQLAlchemy required this (use binary for faster/better performance)
    "asyncpg>=0.31.0", # PostgreSQL async driver that SQLAlchemy uses underneath when you create an async engine
    "pyjwt>=2.13.0",
    "sentry-sdk[fastapi]>=2.68.1,<3.0.0",
    "httpx>=0.28.1",
    "alembic>=1.18.5",
    "gunicorn>=26.0.0", # only works on Linux/WSL/container
    "httptools>=0.8.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "faker>=40.36.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "black>=26.5.1",
    "ruff>=0.16.1",
    "pyrefly>=1.2.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

#[build-system]
#requires = ["hatchling"]
#build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/core/logging.py"]
branch = true

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.report]
show_missing = true
sort = "-Cover"
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused arguments in functions
    "T201", # print statements are not allowed
]
ignore = [
    "E501", # lines too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
